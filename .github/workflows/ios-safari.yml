name: Verify iOS Safari Home Screen
on:
  push:
    branches: ['codex/ios-safari-check']
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful Pages run whose artifact is still live
        required: true
        type: string
permissions:
  actions: read
  contents: read

jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17, iPad (A16)]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify the retained release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run || '45250691263' }}
          SITE_FILES: ${{ runner.temp }}/ios-site
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" |
            jq -e '.path == ".github/workflows/pages.yml" and .head_branch == "main" and .conclusion == "success"'
          gh run download "$RELEASE_RUN" -n site-files -D "$SITE_FILES"
          node scripts/verify-pages.mjs "$SITE_FILES" "$(jq -er '.sourceRevision' "$SITE_FILES/build-info.json")"
      - name: Prepare an isolated iOS 26 simulator and test driver
        env:
          DEVICE_NAME: ${{ matrix.device }}
          APPIUM_HOME: ${{ runner.temp }}/ios-appium-home
        run: |
          set -euo pipefail
          mkdir ios-evidence
          xcodebuild -version | tee ios-evidence/xcode.txt
          xcrun simctl list devices available --json > ios-evidence/devices.json
          selection=$(jq -er --arg device "$DEVICE_NAME"             '[.devices | to_entries[] | select(.key | test("iOS-26-")) |
              .key as $runtime | .value[] | select(.name == $device) | {udid, runtime: $runtime}] |
              sort_by(.runtime | split("iOS-")[1] | split("-") | map(tonumber)) | last' ios-evidence/devices.json)
          udid=$(jq -er '.udid' <<< "$selection")
          printf '%s\n' "$selection" > ios-evidence/selection.json
          printf 'SIMULATOR_UDID=%s\n' "$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          npm install --prefix "$RUNNER_TEMP/ios-driver" --no-audit --no-fund appium@3.9.1
          "$RUNNER_TEMP/ios-driver/node_modules/.bin/appium" driver install xcuitest@10.43.1
      - name: Install, save a draft, and relaunch from the Home Screen
        env:
          APPIUM_HOME: ${{ runner.temp }}/ios-appium-home
          APPIUM_BIN: ${{ runner.temp }}/ios-driver/node_modules/.bin/appium
          SITE_FILES: ${{ runner.temp }}/ios-site
          DEVICE_NAME: ${{ matrix.device }}
        run: node scripts/ios-safari.mjs
      - name: Retain simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-safari-${{ matrix.device }}
          path: ios-evidence/
          if-no-files-found: warn
          retention-days: 14
