name: Verify iOS Safari Home Screen
on:
  push:
    branches: ['codex/ios-safari-check']
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful Pages run whose artifact is still live
        required: true
        type: string
permissions:
  actions: read
  contents: read

jobs:
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        device: [iPad (A16)]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify the retained release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run || '45281471335' }}
          SITE_FILES: ${{ runner.temp }}/ios-site
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" |
            jq -e '.path == ".github/workflows/pages.yml" and .head_branch == "main" and .conclusion == "success"'
          gh run download "$RELEASE_RUN" -n site-files -D "$SITE_FILES"
          node scripts/verify-pages.mjs "$SITE_FILES" "$(jq -er '.sourceRevision' "$SITE_FILES/build-info.json")"
      - name: Prepare an isolated iOS 26 simulator and test driver
        env:
          DEVICE_NAME: ${{ matrix.device }}
          APPIUM_HOME: ${{ runner.temp }}/ios-appium-home
        run: |
          set -euo pipefail
          mkdir ios-evidence
          xcodebuild -version | tee ios-evidence/xcode.txt
          xcrun simctl list devices available --json > ios-evidence/devices.json
          selection=$(jq -er --arg device "$DEVICE_NAME" \
            '"com.apple.CoreSimulator.SimRuntime.iOS-26-2" as $runtime |
              .devices[$runtime][] | select(.name == $device) | {udid, runtime: $runtime}' ios-evidence/devices.json)
          udid=$(jq -er '.udid' <<< "$selection")
          printf '%s\n' "$selection" > ios-evidence/selection.json
          printf 'SIMULATOR_UDID=%s\n' "$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          npm install --prefix "$RUNNER_TEMP/ios-driver" --no-audit --no-fund appium@3.9.1
          "$RUNNER_TEMP/ios-driver/node_modules/.bin/appium" driver install xcuitest@10.43.1
          xcrun simctl bootstatus "$udid" -b
      - name: Build WebDriverAgent for the booted simulator
        env:
          APPIUM_HOME: ${{ runner.temp }}/ios-appium-home
          WDA_BUILD: ${{ runner.temp }}/ios-wda
        run: |
          set -euo pipefail
          project=$(find "$APPIUM_HOME/node_modules" -name WebDriverAgent.xcodeproj -type d -print -quit)
          test -d "$project"
          if ! xcodebuild -project "$project" -scheme WebDriverAgentRunner \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$WDA_BUILD" \
            -parallel-testing-enabled NO build-for-testing > ios-evidence/wda-build.log 2>&1; then
            tail -50 ios-evidence/wda-build.log
            exit 1
          fi
          test -d "$WDA_BUILD/Build/Products/Debug-iphonesimulator/WebDriverAgentRunner-Runner.app"
      - name: Install, save a draft, and relaunch from the Home Screen
        env:
          APPIUM_HOME: ${{ runner.temp }}/ios-appium-home
          APPIUM_BIN: ${{ runner.temp }}/ios-driver/node_modules/.bin/appium
          WDA_BUILD: ${{ runner.temp }}/ios-wda
          SITE_FILES: ${{ runner.temp }}/ios-site
          DEVICE_NAME: ${{ matrix.device }}
        run: node scripts/ios-safari.mjs
      - name: Retain simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-safari-${{ matrix.device }}
          path: ios-evidence/
          if-no-files-found: warn
          retention-days: 14
