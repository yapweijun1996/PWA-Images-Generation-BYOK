name: Verify Windows installed app
on: workflow_dispatch
permissions:
  contents: read

jobs:
  installed:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install browser automation client
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/installed-app-driver" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Install and reopen deployed studio offline
        shell: pwsh
        env:
          BROWSER_CHANNEL: ${{ matrix.browser }}
        run: |
          $env:PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/installed-app-driver/node_modules/playwright-core/index.mjs"
          $vendor = if ($env:BROWSER_CHANNEL -eq 'edge') { 'Microsoft\Edge' } else { 'Google\Chrome' }
          $key = "HKLM:\SOFTWARE\Policies\$vendor"
          New-Item -Path $key -Force | Out-Null
          if ((Get-Item $key).GetValue('WebAppInstallForceList') -ne $null) { throw 'Runner already has managed web apps configured.' }
          $entry = @{url='https://yapweijun1996.github.io/PWA-Images-Generation-BYOK/'; default_launch_container='window'; create_desktop_shortcut=$true}
          $value = ConvertTo-Json -InputObject @($entry) -Compress
          New-ItemProperty -Path $key -Name WebAppInstallForceList -Value $value -PropertyType String | Out-Null
          node scripts/windows-installed.mjs $env:BROWSER_CHANNEL
      - name: Retain scoped evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installed-${{ matrix.browser }}
          path: windows-evidence/
          if-no-files-found: warn
          retention-days: 14
